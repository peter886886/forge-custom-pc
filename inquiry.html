<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>General Inquiry | FORGE</title>
<meta name="description" content="Send FORGE a general inquiry.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<section class="phero"><div class="wrap"><p class="crumb"><a href="index.html">Home</a> / <a href="contact.html">Support</a> / Inquiry</p><h1>General <span class="grad">Inquiry</span></h1><p>Questions about builds, parts, business orders or services? We reply within 24 hours.</p></div></section>
<section style="padding-top:10px"><div class="wrap formbox"><form class="card" id="f" novalidate>
 <div class="row"><div class="field"><label for="name">Name *</label><input id="name" name="name" data-rule="req"><div class="err"></div></div>
 <div class="field"><label for="email">Email *</label><input id="email" name="email" data-rule="req|email"><div class="err"></div></div></div>
 <div class="row"><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" data-rule="phone"><div class="err"></div></div>
 <div class="field"><label for="topic">Topic</label><select id="topic" name="topic"><option>Custom build advice</option><option>Product availability</option><option>Business / bulk order</option><option>Book a service</option><option>Other</option></select></div></div>
 <div class="field"><label>Preferred contact</label><div style="display:flex;gap:16px"><label class="chk"><input type="radio" name="pref" checked> Email</label><label class="chk"><input type="radio" name="pref"> Phone</label><label class="chk"><input type="radio" name="pref"> WhatsApp</label></div></div>
 <div class="field"><label for="msg">Message * <small id="cnt">0/500</small></label><textarea id="msg" name="msg" rows="5" maxlength="500" data-rule="req|min:10"></textarea><div class="err"></div></div>
 <button class="btn solid">Send inquiry</button>
</form></div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>function saveTicket(type,f){const id=ticket(type);const t=JSON.parse(localStorage.getItem('forgeTickets')||'[]');t.unshift({id,type,name:f.name.value,msg:(f.msg||f.desc).value.slice(0,80),date:new Date().toLocaleDateString()});localStorage.setItem('forgeTickets',JSON.stringify(t.slice(0,20)));return id}
function done(f,id,msg){const c=document.createElement('div');c.className='card center';c.innerHTML='<div class="check">✓</div><h2>Submitted</h2><p class="mut"></p><p>Your reference: <b></b></p><br><a class="btn" href="index.html">Back to Home</a>';c.querySelector('p').textContent=msg;c.querySelector('b').textContent=id;f.replaceWith(c)}
const f=$('#f');liveValidate(f);$('#msg').oninput=e=>$('#cnt').textContent=e.target.value.length+'/500';
f.onsubmit=e=>{e.preventDefault();if(!validate(f))return;done(f,saveTicket('INQ',f),'Thanks! Our team will reply to '+f.email.value+' within 24 hours.')};</script>
</body>
</html>
