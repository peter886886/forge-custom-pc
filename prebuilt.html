<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prebuilt PCs | FORGE</title>
<meta name="description" content="Ready-to-ship FORGE gaming and workstation PCs.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230A0A0A%27/%3E%3Crect x=%277%27 y=%277%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23E5A93C%27/%3E%3Crect x=%2717%27 y=%2717%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23F5F5F5%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<section class="phero"><div class="wrap"><p class="crumb"><a href="index.html">Home</a> / Shop / Prebuilt</p><h1>Prebuilt <span class="grad">Systems</span></h1><p>Bench-calibrated configurations shipped in 48 hours. Open any system in the 3D Builder to customize components. All prices in USD (including $99 lab assembly &amp; 24h OCCT burn-in).</p></div></section>
<section style="padding-top:24px"><div class="wrap"><h2 class="sr-only">Ready-to-Ship Reference Systems</h2><div class="grid" id="pb" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"></div></div></section>
<section><div class="wrap"><h2>System Comparison (USD)</h2><div class="tblwrap" style="margin-top:16px"><table id="cmp"></table></div></div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
const PREBUILT_IMGS = {
  pb1: ['img/products/pb1.webp', 'img/installed/x2.webp'],
  pb2: ['img/products/pb2.webp', 'img/installed/g4.webp'],
  pb3: ['img/products/pb3.webp', 'img/renders/hero_rig_studio.webp'],
  pb4: ['img/products/pb4.webp', 'img/installed/x3.webp']
};

$('#pb').innerHTML = PREBUILT.map(k => `
  <div class="card reveal" style="display:flex;flex-direction:column">
    <div class="pimg" style="height:220px;border-radius:8px" title="Hover to inspect internal architecture">
      <img class="main-photo has-alt" src="${PREBUILT_IMGS[k.id][0]}" style="width:100%;height:100%;object-fit:contain;padding:14px" alt="${esc(k.name)}" loading="lazy" decoding="async">
      <img class="alt-photo" src="${PREBUILT_IMGS[k.id][1]}" style="width:100%;height:100%;object-fit:cover" alt="${esc(k.name)} Internal Architecture" loading="lazy" decoding="async">
      <span style="position:absolute;bottom:8px;right:8px;z-index:2;font-size:.66rem;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:rgba(14,14,14,.84);border:1px solid var(--line);color:var(--mut);pointer-events:none">Hover · Interior</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
      <span class="tag">${k.tag}</span>
      <span class="mut" style="font-size:.74rem;font-family:var(--mono)">48h Dispatch</span>
    </div>
    <h3 style="margin-top:10px">${k.name}</h3>
    <p class="mut" style="font-size:.88rem;margin-top:4px">${k.desc}</p>
    <div style="margin:12px 0 8px;padding:10px 12px;background:#121212;border:1px solid var(--line);border-radius:8px;font-size:.81rem">
      <span class="mut" style="display:block;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px">Included Accessories</span>
      <span style="color:var(--txt)">${k.parts.filter(id => byId(id)?.cat === 'acc').map(id => byId(id).name).join(', ') || 'Custom Braided Cabling'}</span>
    </div>
    <ul class="mut" style="margin:8px 0 18px 18px;font-size:.86rem;display:grid;gap:3px">
      ${k.parts.filter(i => byId(i) && byId(i).cat !== 'acc' && byId(i).cat !== 'case').map(i => '<li>' + byId(i).name + '</li>').join('')}
    </ul>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;margin-bottom:10px">
      <span class="price">${money(kitPrice(k))}</span>
      <a class="mut" style="font-size:.8rem;text-decoration:underline;text-underline-offset:3px" href="builder.html?kit=${k.id}">Customize in 3D →</a>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn sm" type="button" style="justify-content:center" data-kit-bag="${k.id}">Add to Bag</button>
      <a class="btn sm solid" style="justify-content:center" href="order-confirm.html?id=${k.id}&qty=1">Buy Now</a>
    </div>
  </div>
`).join('');
$('#pb').onclick = e => {
  const btn = e.target.closest('[data-kit-bag]');
  if (!btn || typeof forgeCart === 'undefined') return;
  const k = byId(btn.dataset.kitBag);
  if (!k) return;
  forgeCart.addToCart({
    id: k.id,
    type: 'kit',
    name: k.name,
    spec: `${k.tag} · Includes $99 Lab Assembly`,
    price: kitPrice(k),
    qty: 1,
    asm: 0,
    img: PREBUILT_IMGS[k.id][0]
  });
};
const rows=['cpu','gpu','ram','ssd','psu','cool','case','acc'];
$('#cmp').innerHTML='<thead><tr><th scope="col">Component</th>'+PREBUILT.map(k=>`<th scope="col">${esc(k.name)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(c=>`<tr><th scope="row">${CATS[c]}</th>${PREBUILT.map(k=>{const list=k.parts.filter(i=>byId(i)?.cat===c).map(i=>esc(byId(i).name));return `<td>${list.length?list.join('<br>'):'—'}</td>`}).join('')}</tr>`).join('')+'<tr><th scope="row"><b style="color:var(--txt)">Price USD (inc. $99 Assembly)</b></th>'+PREBUILT.map(k=>`<td class="price">${money(kitPrice(k))}</td>`).join('')+'</tr></tbody>';
</script>
</body>
</html>
