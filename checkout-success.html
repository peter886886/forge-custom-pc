<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Placed | FORGE</title>
<meta name="description" content="Thank you for your order.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230A0A0A%27/%3E%3Crect x=%277%27 y=%277%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23E5A93C%27/%3E%3Crect x=%2717%27 y=%2717%27 width=%278%27 height=%278%27 rx=%272%27 fill=%27%23F5F5F5%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<section class="phero"><div class="wrap formbox card center reveal" id="checkoutCard">
 <div class="check"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
 <h1>Thank you!</h1>
 <p class="mut">Your order has been received and our Kwun Tong technicians are assigning your build bench.</p>
 <div id="integrityStatus"></div>
 <div class="tblwrap" style="margin:20px 0 24px;text-align:left"><table><tbody id="r"></tbody></table></div>
 <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
  <a class="btn solid" id="trackOrderBtn" href="order-detail.html">Track Build &amp; Order Details →</a>
  <a class="btn outline" href="member-dashboard.html">View Invoice / Orders</a>
  <a class="btn subtle" href="index.html">Back to Home</a>
 </div>
</div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
const q = qs();
const hasCheckoutParams = !!(q.items || q.spec || (q.total !== undefined && q.total !== '') || q.service || q.svc);

if (!hasCheckoutParams) {
  $('#checkoutCard').innerHTML = `
    <div style="width:56px;height:56px;border-radius:14px;background:#1A1A1A;border:1px solid var(--line-hi);display:grid;place-items:center;color:var(--mut);margin:0 auto 16px">
      <span style="width:22px;height:22px;display:inline-flex">${ICONS.bag}</span>
    </div>
    <h1>No Active <span class="grad">Checkout</span></h1>
    <p class="mut" style="margin:10px auto 22px;max-width:44ch">This confirmation page displays submitted orders after checkout. Open your Shopping Bag to review items, or track an existing order below.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn solid" href="cart.html">Open Shopping Bag</a>
      <a class="btn" href="order-detail.html">Track Existing Orders</a>
      <a class="btn subtle" href="builder.html">3D Configurator</a>
    </div>`;
} else {
  const id = ticket('FG');
  fillResult($('#r'), { name: 'Name', delivery: 'Delivery Method', address: 'Delivery address', pay: 'Payment', items: 'Items' });
  $('#r').insertAdjacentHTML('afterbegin', `<tr><th scope="row">Order no.</th><td><b style="font-family:var(--mono)">${esc(id)}</b></td></tr>`);
  $('#trackOrderBtn').href = `order-detail.html?id=${encodeURIComponent(id)}`;

  function resolveCatalogTotal(specStr) {
    if (!specStr) return null;
    const hasForge5 = String(q.promo || '').trim().toUpperCase() === 'FORGE5';
    let hwSub = 0, asm = 0, ok = false;
    const serviceEntries = [];

    if (specStr.startsWith('cart:')) {
      const entries = specStr.slice(5).split('|').filter(Boolean);
      if (!entries.length) return null;
      for (const ent of entries) {
        const seg = ent.split(':');
        const kind = seg[0];
        if (kind === 'p' && seg.length >= 3) {
          const p = byId(seg[1]);
          const qt = Math.max(1, Number(seg[2]) || 1);
          if (!p || !Number.isFinite(qt)) return null;
          hwSub += p.price * qt;
          ok = true;
        } else if (kind === 'k' && seg.length >= 3) {
          const p = byId(seg[1]);
          const qt = Math.max(1, Number(seg[2]) || 1);
          if (!p || !p.parts || !Number.isFinite(qt)) return null;
          hwSub += kitPrice(p) * qt;
          ok = true;
        } else if (kind === 'b' && seg.length >= 3) {
          const ids = seg[1].split('+').map(s => byId(s.trim())).filter(Boolean);
          const qt = Math.max(1, Number(seg[2]) || 1);
          if (!ids.length || !Number.isFinite(qt)) return null;
          hwSub += ids.reduce((s, p) => s + (p.price || 0), 0) * qt;
          asm += 99 * qt;
          ok = true;
        } else if (kind === 's' && seg.length >= 3) {
          const svc = serviceByIdOrName(seg[1]);
          const qt = Math.max(1, Number(seg[2]) || 1);
          if (!svc || !Number.isFinite(qt)) return null;
          serviceEntries.push({ svc, qty: qt });
          ok = true;
        } else {
          return null;
        }
      }
      if (!ok) return null;
      return computeOrderPricing({ hwSub, serviceEntries, asm, isMember: !!user(), hasForge5 }).total;
    }

    const parts = specStr.split(':');
    if (parts[0] === 'svc' && parts.length >= 3) {
      const svc = serviceByIdOrName(parts[1]) || serviceByIdOrName(q.service || q.items);
      const qt = Math.max(1, Number(parts[2]) || 1);
      if (svc && Number.isFinite(qt)) {
        serviceEntries.push({ svc, qty: qt });
        ok = true;
      }
    } else if (parts[0] === 'build' && parts[1]) {
      const items = parts[1].split(',').map(s => byId(s.trim())).filter(Boolean);
      if (items.length) {
        hwSub = items.reduce((s, p) => s + (p.price || 0), 0);
        asm = 99;
        ok = true;
      }
    } else if (parts.length >= 2) {
      const p = byId(parts[0]);
      const qt = Math.max(1, Number(parts[1]) || 1);
      if (p && Number.isFinite(qt)) {
        hwSub = (p.parts ? kitPrice(p) : p.price) * qt;
        ok = true;
      }
    }
    if (!ok) return null;
    return computeOrderPricing({ hwSub, serviceEntries, asm, isMember: !!user(), hasForge5 }).total;
  }

  function buildItemsList(specStr, fallbackTotal) {
    if (q.src === 'cart' && typeof forgeCart !== 'undefined') {
      const c = forgeCart.getCart();
      if (c.length) return c;
    }
    if (specStr) {
      if (specStr.startsWith('cart:')) {
        const list = [];
        specStr.slice(5).split('|').filter(Boolean).forEach(ent => {
          const seg = ent.split(':');
          const qt = Math.max(1, Number(seg[2]) || 1);
          if (seg[0] === 'p') {
            const p = byId(seg[1]);
            if (p) list.push({ id: p.id, type: 'part', name: p.name, spec: p.spec, price: p.price, qty: qt, asm: 0, img: `img/products/${p.id}.webp` });
          } else if (seg[0] === 'k') {
            const k = byId(seg[1]);
            if (k) list.push({ id: k.id, type: 'kit', name: k.name, spec: k.tag, price: kitPrice(k), qty: qt, asm: 0, img: `img/products/${k.id}.webp` });
          } else if (seg[0] === 'b') {
            const ids = seg[1].split('+').filter(Boolean);
            const parts = ids.map(byId).filter(Boolean);
            const sub = parts.reduce((s, p) => s + p.price, 0);
            if (parts.length) list.push({ id: 'custom', type: 'build', name: `Custom 3D Build (${parts.length} parts)`, spec: parts.slice(0, 3).map(p => p.name).join(' · '), price: sub, qty: qt, asm: 99, img: 'img/renders/hero_rig_studio.webp', items: ids });
          } else if (seg[0] === 's') {
            const svc = serviceByIdOrName(seg[1]);
            if (svc) list.push({ id: svc.id, type: 'service', name: svc.name + ' (FORGE Certified Service)', spec: svc.tag, price: svc.price, qty: qt, asm: 0, img: 'img/renders/hero_rig_studio.webp' });
          }
        });
        if (list.length) return list;
      }
      const parts = specStr.split(':');
      if (parts[0] === 'svc') {
        const svc = serviceByIdOrName(parts[1]) || serviceByIdOrName(q.service || q.items);
        if (svc) return [{ id: svc.id, type: 'service', name: svc.name + ' (FORGE Certified Service)', spec: svc.tag, price: svc.price, qty: Math.max(1, Number(parts[2]) || 1), asm: 0, img: 'img/renders/hero_rig_studio.webp' }];
      }
      if (parts[0] === 'build' && parts[1]) {
        const ids = parts[1].split(',').map(s => s.trim()).filter(Boolean);
        const valid = ids.map(byId).filter(Boolean);
        if (valid.length) return valid.map(p => ({ id: p.id, type: 'part', name: p.name, spec: p.spec, price: p.price, qty: 1, asm: 0, img: `img/products/${p.id}.webp` })).concat([{ id: 'asm', type: 'service', name: 'Single-Tech Assembly & 24h OCCT Burn-In', spec: 'Kwun Tong Lab QA Certification', price: 99, qty: 1, asm: 0, img: 'img/renders/hero_rig_studio.webp' }]);
      }
      const p = byId(parts[0]);
      if (p) {
        const qt = Math.max(1, Number(parts[1]) || 1);
        return [{ id: p.id, type: p.parts ? 'kit' : 'part', name: p.name, spec: p.spec || p.tag || 'FORGE Hardware', price: p.parts ? kitPrice(p) : p.price, qty: qt, asm: 0, img: `img/products/${p.id}.webp` }];
      }
    }
    return [{ id: 'order', type: 'part', name: q.items || 'FORGE Hardware Order', spec: 'Verified Order', price: fallbackTotal, qty: 1, asm: 0, img: 'img/renders/hero_rig_studio.webp' }];
  }

  let effectiveSpec = q.spec || '';
  if (!effectiveSpec && (q.svc || q.service)) {
    const svc = serviceByIdOrName(q.svc || q.service);
    if (svc) effectiveSpec = `svc:${svc.id}:${Math.max(1, Number(q.qty) || 1)}`;
    else effectiveSpec = `svc:unknown:1`;
  }

  const submittedRaw = q.total !== undefined ? q.total : q.price;
  const submittedTotal = Number(submittedRaw);
  const submittedDisplay = Number.isFinite(submittedTotal) ? submittedTotal : 0;
  let finalTotal = Math.max(0, Number(submittedRaw) || 0);
  let tamperBlocked = false;

  if (effectiveSpec) {
    const trustedTotal = resolveCatalogTotal(effectiveSpec);
    if (trustedTotal === null) {
      tamperBlocked = true;
      $('#integrityStatus').innerHTML = `<div role="alert" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.45);border-radius:10px;padding:14px 16px;text-align:left;margin-top:18px;color:#FECACA"><div style="font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--danger);font-weight:600;margin-bottom:4px">ORDER PRICE VERIFICATION ALERT</div><p style="font-size:.875rem;color:#FCA5A5">Submitted item or service specification could not be matched against the official FORGE catalog.</p></div>`;
      $('#r').insertAdjacentHTML('beforeend', `<tr><th scope="row">Submitted URL Total</th><td><span class="status s-b" style="margin-right:8px">Rejected</span><s class="mut" style="font-family:var(--mono)">${esc(money(submittedDisplay))}</s></td></tr><tr><th scope="row">Total (USD)</th><td><b class="price">${esc(money(finalTotal))}</b></td></tr>`);
    } else if (!Number.isFinite(submittedTotal) || Math.round(submittedTotal) !== trustedTotal) {
      tamperBlocked = true;
      finalTotal = trustedTotal;
      $('#integrityStatus').innerHTML = `<div role="alert" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.45);border-radius:10px;padding:14px 16px;text-align:left;margin-top:18px;color:#FECACA"><div style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--danger);font-weight:600;margin-bottom:4px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>ORDER PRICE VERIFICATION ALERT</span></div><p id="tamperMsg" style="font-size:.875rem;line-height:1.5;color:#FCA5A5"></p></div>`;
      $('#tamperMsg').textContent = `Submitted URL total (${money(submittedDisplay)}) did not match catalog lookup — authoritative total (${money(trustedTotal)} USD) enforced.`;
      $('#r').insertAdjacentHTML('beforeend', `<tr><th scope="row">Submitted URL Total</th><td><span class="status s-b" style="margin-right:8px">Adjusted</span><s class="mut" style="font-family:var(--mono)">${esc(money(submittedDisplay))}</s></td></tr><tr><th scope="row">Verified Total (USD)</th><td><b class="price">${esc(money(trustedTotal))}</b> <span class="mut" style="font-family:var(--mono);font-size:.75rem">(USD)</span></td></tr>`);
    } else {
      finalTotal = trustedTotal;
      $('#integrityStatus').innerHTML = `<div style="margin-top:16px"><span class="status s-ok">Catalog Price Verified</span></div>`;
      $('#r').insertAdjacentHTML('beforeend', `<tr><th scope="row">Total (USD)</th><td><b class="price">${esc(money(trustedTotal))}</b></td></tr>`);
    }
  } else {
    $('#r').insertAdjacentHTML('beforeend', `<tr><th scope="row">Total (USD)</th><td><b class="price">${esc(money(finalTotal))}</b></td></tr>`);
  }

  const itemsList = buildItemsList(effectiveSpec, finalTotal);
  const u = user();
  const h = window.ensureSeedOrders ? window.ensureSeedOrders() : JSON.parse(localStorage.getItem('forgeOrders') || '[]');
  h.unshift({
    id,
    total: finalTotal,
    date: new Date().toISOString().slice(0, 10),
    items: q.items || itemsList.map(x => x.name).join('; '),
    itemsList,
    customer: q.name || (u ? u.name : 'Customer'),
    address: q.address || 'Hong Kong SAR',
    pay: q.pay || 'Visa / Mastercard',
    delivery: q.delivery || 'SF Express Insured 5-Day Courier',
    stage: 1,
    status: 'Confirmed',
    tamperBlocked,
    submittedTotal: tamperBlocked ? submittedDisplay : undefined
  });
  localStorage.setItem('forgeOrders', JSON.stringify(h.slice(0, 20)));
  if (q.src === 'cart' && typeof forgeCart !== 'undefined') {
    forgeCart.clearCart();
  }
  if (q.src !== 'cart') {
    localStorage.removeItem('forgeOrder');
  }
}
</script>
</body>
</html>
