<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Dashboard | FORGE</title>
<meta name="description" content="FORGE internal staff dashboard.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<section><div class="wrap">
 <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><p class="eyebrow">Staff portal</p><h2>Operations <span class="grad">Dashboard</span></h2></div><button class="btn subtle sm" id="out">Log out</button></div>
 <div class="grid" style="margin:20px 0">
  <div class="card kpi"><span class="mut">Revenue (Nov)</span><b data-count="248600" data-pre="$" data-suf="">$0</b></div>
  <div class="card kpi"><span class="mut">Orders in progress</span><b data-count="37">0</b></div>
  <div class="card kpi"><span class="mut">Open tickets</span><b id="tk">0</b></div>
  <div class="card kpi"><span class="mut">Satisfaction</span><b data-count="98" data-suf="%">0</b></div>
 </div>
 <div class="g2" style="align-items:start">
  <div class="card"><h3>Weekly sales</h3><div id="chart" style="display:flex;align-items:flex-end;gap:12px;height:210px;padding-top:16px;margin-top:18px"></div></div>
  <div class="card"><h3>Latest customer tickets</h3><div class="tblwrap" style="margin-top:14px"><table><thead><tr><th>Ref</th><th>Name</th><th>Message</th></tr></thead><tbody id="tl"></tbody></table></div></div>
 </div>
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:32px 0 14px">
  <div style="display:flex;align-items:baseline;gap:10px">
   <h3 style="margin:0">Inventory</h3>
   <span class="mut" id="invCount" style="font-family:var(--mono);font-size:.78rem"></span>
  </div>
  <div class="field" style="margin:0;min-width:250px;flex:0 1 320px">
   <input id="invQ" type="search" placeholder="Filter 53 parts by name or category…" aria-label="Filter inventory">
  </div>
 </div>
 <div class="tblwrap"><table><thead><tr><th>Part</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="inv"></tbody></table></div>
</div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>const U=user();if(!U||U.role!=='staff'){location.href='login.html'};
$('#out').onclick=()=>{localStorage.removeItem('forgeUser');location.href='login.html'};
const W=[['Mon',42],['Tue',58],['Wed',51],['Thu',73],['Fri',88],['Sat',100],['Sun',66]];
$('#chart').innerHTML=W.map(([d,v])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px"><span style="font-family:var(--mono);font-size:.72rem;color:var(--txt);font-variant-numeric:tabular-nums">${v}</span><div title="${v} orders" style="width:100%;height:${Math.round(v*1.4)}px;background:linear-gradient(180deg, var(--pri), #27272A);border-radius:6px 6px 0 0;transition:opacity .2s" onmouseover="this.style.opacity='.75'" onmouseout="this.style.opacity='1'"></div><small class="mut" style="font-family:var(--mono);font-size:.72rem">${d}</small></div>`).join('');
const T=JSON.parse(localStorage.getItem('forgeTickets')||'[]');$('#tk').textContent=T.length+5;
$('#tl').innerHTML=T.slice(0,6).map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.name)}</td><td>${esc(t.msg)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">No new tickets.</td></tr>';
const indexedParts=PARTS.map((p,i)=>({p,stock:(i*37+11)%60}));
function renderInv(q=''){
 const needle=q.trim().toLowerCase();
 const rows=indexedParts.filter(({p})=>!needle||p.name.toLowerCase().includes(needle)||CATS[p.cat].toLowerCase().includes(needle)||p.id.toLowerCase().includes(needle));
 $('#invCount').textContent=`${rows.length} / ${PARTS.length} items`;
 $('#inv').innerHTML=rows.map(({p,stock})=>`<tr><td>${esc(p.name)}</td><td>${esc(CATS[p.cat])}</td><td style="font-family:var(--mono)">${money(p.price)}</td><td style="font-family:var(--mono)">${stock}</td><td><span class="status ${stock<10?'s-b':stock<25?'s-w':'s-ok'}">${stock<10?'Reorder':stock<25?'Low':'OK'}</span></td></tr>`).join('')||'<tr><td colspan="5" class="mut center">No matching components found.</td></tr>';
}
renderInv();
$('#invQ').oninput=e=>renderInv(e.target.value);</script>
</body>
</html>
