<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | FORGE</title>
<meta name="description" content="Customer and staff login for FORGE.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<section class="phero"><div class="wrap" style="max-width:440px">
 <div class="card reveal">
  <h2 class="center">Welcome <span class="grad">back</span></h2>
  <div class="tabs" style="margin-top:16px"><button type="button" class="on" data-r="customer">Customer</button><button type="button" data-r="staff">Staff</button></div>
  <form id="lf" novalidate style="display:grid;gap:14px">
   <div class="field"><label for="u" id="ul">Email</label><input id="u" data-rule="req" autocomplete="username"><div class="err"></div></div>
   <div class="field"><label for="p">Password</label><div style="position:relative"><input type="password" id="p" data-rule="req" autocomplete="current-password" style="padding-right:40px"><button type="button" id="eye" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--mut);display:inline-flex;align-items:center;padding:4px" aria-label="Show password"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="err"></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center;font-size:.875rem"><label class="chk"><input type="checkbox" id="rem"> Remember me</label><a href="#" onclick="toast('A reset link has been sent (demo)');return false">Forgot?</a></div>
   <button class="btn solid" style="width:100%;justify-content:center" id="go">Log in</button>
   <p class="err center" id="msg" style="min-height:18px"></p>
  </form>
  <p class="center mut" id="reg" style="margin-top:8px;font-size:.875rem">New here? <a href="register.html">Create an account</a></p>
  <p class="center mut" style="font-size:.78rem;margin-top:12px">Demo — Customer: <b>demo@forge.hk / Forge2026</b><br>Staff: <b>staff01 / Admin@2026</b></p>
  <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px">
   <button type="button" class="chip sm" id="demoCust">Customer Demo</button>
   <button type="button" class="chip sm" id="demoStaff">Staff Demo</button>
  </div>
 </div></div></section>
</main>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>let role='customer',fails=+sessionStorage.getItem('fails')||0;
const EYE_OPEN=`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF=`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>`;
function setRole(r){role=r;$$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.r===r));$('#ul').textContent=role==='staff'?'Staff ID':'Email';$('#reg').style.display=role==='staff'?'none':'block';}
$$('.tabs button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
$('#eye').onclick=()=>{const p=$('#p'),show=p.type==='password';p.type=show?'text':'password';$('#eye').innerHTML=show?EYE_OFF:EYE_OPEN;$('#eye').setAttribute('aria-label',show?'Hide password':'Show password');};
$('#demoCust').onclick=()=>{setRole('customer');$('#u').value='demo@forge.hk';$('#p').value='Forge2026';$('#msg').textContent='';validate($('#lf'));toast('Customer demo credentials filled');};
$('#demoStaff').onclick=()=>{setRole('staff');$('#u').value='staff01';$('#p').value='Admin@2026';$('#msg').textContent='';validate($('#lf'));toast('Staff demo credentials filled');};
$('#lf').onsubmit=e=>{e.preventDefault();
 const lock=+sessionStorage.getItem('lockUntil')||0;if(Date.now()<lock){$('#msg').textContent='Too many attempts. Try again in '+Math.ceil((lock-Date.now())/1000)+'s.';return}
 if(!validate(e.target))return;
 const u=$('#u').value.trim(),p=$('#p').value,reg=JSON.parse(localStorage.getItem('forgeReg')||'null');
 let ok=null;
 if(role==='staff'&&u==='staff01'&&p==='Admin@2026')ok={name:'Staff 01',role:'staff'};
 if(role==='customer'&&((u==='demo@forge.hk'&&p==='Forge2026')||(reg&&reg.email===u)))ok={name:reg&&reg.email===u?reg.name:'Demo User',email:u,role:'customer'};
 if(!ok){fails++;sessionStorage.setItem('fails',fails);if(fails>=3){sessionStorage.setItem('lockUntil',Date.now()+30000);fails=0;sessionStorage.setItem('fails',0)}
  $('#msg').textContent='Invalid credentials.'+(fails?' '+(3-fails)+' attempt(s) left.':' Locked for 30s.');return}
 sessionStorage.setItem('fails',0);localStorage.setItem('forgeUser',JSON.stringify(ok));toast('Welcome, '+ok.name);
 setTimeout(()=>location.href=role==='staff'?'staff-dashboard.html':'member-dashboard.html',600)};</script>
</body>
</html>
